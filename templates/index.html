<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>待办事项</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
  </head>
  <body>
    <main class="shell">
      <header class="header">
        <p class="eyebrow">Todo</p>
        <h1>待办事项</h1>
      </header>

      <form class="add-form" action="{{ url_for('add_todo') }}" method="post">
        <input
          name="title"
          type="text"
          autocomplete="off"
          maxlength="120"
          placeholder="添加一个任务..."
          aria-label="添加一个任务"
          required
        >
        <button type="submit">添加</button>
      </form>

      <section class="list" aria-label="任务列表">
        {% if todos %}
          {% for todo in todos %}
            <article class="todo">
              <span>{{ todo.title }}</span>
              <form action="{{ url_for('delete_todo', todo_id=todo.id) }}" method="post">
                <button class="delete" type="submit" aria-label="删除 {{ todo.title }}">删除</button>
              </form>
            </article>
          {% endfor %}
        {% else %}
          <p class="empty">还没有任务。</p>
        {% endif %}
      </section>
    </main>
  </body>
</html>
